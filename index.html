<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#C23A2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="租屋筆記">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>租屋筆記</title>
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: single 640px column, sticky top bar, bottom thumb-zone action bar; "吉屋出租" signage red as the only accent */
:root{
  --bg:#EDEFEB; --surface:#FFFFFF; --sunk:#E2E6E0; --ink:#1A1E1B; --muted:#5B635D; --line:#D3D8D2;
  --accent:#C23A2B; --accent-ink:#FFFFFF; --accent-soft:#F8E2DD;
  --ok:#1E7547; --ok-bg:#DBEFE2; --warn:#8F5600; --warn-bg:#FAE9CC;
  --info:#1D5C99; --info-bg:#DAE7F5; --vio:#5642A3; --vio-bg:#E6E1F5;
  --teal:#0E6B6B; --teal-bg:#D4ECEA; --mute:#69706B; --mute-bg:#E1E4E0;
  --star:#C98C00; --scrim:rgb(10 14 12 / .45); --viewer:#000000; --viewer-ink:#FFFFFF;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1210; --surface:#181C19; --sunk:#222723; --ink:#E5EAE6; --muted:#9AA39C; --line:#2C332E;
  --accent:#E8604F; --accent-ink:#FFFFFF; --accent-soft:#3B1F1A;
  --ok:#6FCB98; --ok-bg:#16301F; --warn:#EDB862; --warn-bg:#382A12;
  --info:#82B4EA; --info-bg:#16283D; --vio:#B4A6F0; --vio-bg:#29233F;
  --teal:#6CCFCA; --teal-bg:#123130; --mute:#8D958F; --mute-bg:#252A26;
  --star:#F2BF3E; --scrim:rgb(0 0 0 / .6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1210; --surface:#181C19; --sunk:#222723; --ink:#E5EAE6; --muted:#9AA39C; --line:#2C332E;
  --accent:#E8604F; --accent-ink:#FFFFFF; --accent-soft:#3B1F1A;
  --ok:#6FCB98; --ok-bg:#16301F; --warn:#EDB862; --warn-bg:#382A12;
  --info:#82B4EA; --info-bg:#16283D; --vio:#B4A6F0; --vio-bg:#29233F;
  --teal:#6CCFCA; --teal-bg:#123130; --mute:#8D958F; --mute-bg:#252A26;
  --star:#F2BF3E; --scrim:rgb(0 0 0 / .6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
h1,h2,h3,p{margin:0}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.fill{fill:currentColor;stroke:none}
.ic.on{fill:currentColor}
#app{max-width:640px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px}
.bar1{display:flex;align-items:center;gap:10px;min-height:44px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tag{width:34px;height:34px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
.brand h1{font-size:18px;font-weight:800;letter-spacing:.02em;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.ttl{flex:1;min-width:0;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--ink)}
.ib:active{background:var(--sunk)}
.ib.on{background:var(--ink);color:var(--surface)}
.ib.star .ic{color:var(--star)}
.bar2{display:flex;gap:8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--sunk);border-radius:12px;padding:0 10px;height:44px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:transparent;height:44px;font-size:16px;color:var(--ink);outline:none}
.fbtn{display:flex;align-items:center;gap:4px;height:44px;padding:0 12px;border-radius:12px;background:var(--sunk);font-weight:600;flex:none}
.fbtn.on{background:var(--accent-soft);color:var(--accent)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.chips::-webkit-scrollbar{display:none}
.tabchip{flex:none;height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;display:flex;align-items:center;gap:5px}
.tabchip b{font-weight:600;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tabchip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabchip.on b{color:inherit;opacity:.75}
#main{padding-block:12px 128px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.meta-line{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.meta-line button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.list{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.card.dim{opacity:.62}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.thumb{width:76px;height:76px;border-radius:10px;background:var(--sunk);overflow:hidden;position:relative;display:grid;place-items:center;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;right:4px;bottom:4px;background:var(--scrim);color:#fff;font-size:11px;border-radius:6px;padding:0 5px}
.check{position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;color:var(--accent-ink)}
.card.sel .check{background:var(--accent);border-color:var(--accent)}
.check .ic{width:14px;height:14px;stroke-width:3}
.cbody{min-width:0;display:flex;flex-direction:column;gap:2px}
.crow1{display:flex;align-items:center;gap:4px}
.crow1 h3{font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow1 .ic{width:16px;height:16px;color:var(--star)}
.crow2{display:flex;align-items:baseline;gap:8px;min-width:0}
.rent{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.rent small{font-size:12px;font-weight:500;color:var(--muted);margin-left:2px}
.rent.unk{font-size:14px;font-weight:600;color:var(--muted)}
.meta{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crow3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.sub{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;padding:1px 8px;border-radius:999px;font-weight:700;white-space:nowrap;line-height:1.6}
.pill.n{background:var(--sunk);color:var(--ink)} .pill.a{background:var(--warn-bg);color:var(--warn)}
.pill.g{background:var(--ok-bg);color:var(--ok)} .pill.b{background:var(--info-bg);color:var(--info)}
.pill.v{background:var(--vio-bg);color:var(--vio)} .pill.t{background:var(--teal-bg);color:var(--teal)}
.pill.x{background:var(--mute-bg);color:var(--mute)}
.pill.due{background:var(--accent);color:var(--accent-ink)}
.mini{color:var(--muted);white-space:nowrap}
.mini.st{color:var(--star);font-weight:700}
.callbtn{width:50px;height:50px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;flex:none}
.callbtn .ic{width:22px;height:22px}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;height:56px;padding:0 22px;border-radius:28px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:6px;font-weight:700;font-size:16px;box-shadow:0 6px 18px rgb(0 0 0 / .22)}
.fab .ic{width:22px;height:22px;stroke-width:2.4}
.bbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bbar>div{max-width:608px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bbar .info{flex:1;font-size:14px;color:var(--muted)}
.btn{min-height:48px;border-radius:12px;padding:0 16px;font-size:16px;font-weight:700;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--surface);border-color:transparent}
.btn.okb{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.btn.ghost{border-color:transparent;background:var(--sunk)}
.btn.danger{color:var(--accent)}
.btn.sm{min-height:38px;font-size:14px;padding:0 12px;border-radius:10px}
.btn:disabled{opacity:.45}
.grow{flex:1}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sec h2,.slabel{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;color:var(--muted);font-weight:600}
.fld>span em{font-style:normal;font-weight:400}
input[type=text],input[type=tel],input[type=number],input[type=date],input[type=datetime-local],input[type=search],textarea{font:inherit;font-size:16px;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 12px;width:100%;min-width:0;-webkit-appearance:none;appearance:none}
input[type=date],input[type=datetime-local]{padding:10px 12px}
textarea{min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.stars{display:flex;gap:2px}
.stars button{width:46px;height:46px;display:grid;place-items:center;color:var(--line)}
.stars button.on{color:var(--star)}
.stars .ic{width:32px;height:32px;fill:currentColor;stroke:none}
.phrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.ph{flex:none;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--sunk);position:relative;display:grid;place-items:center;color:var(--muted)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.missing::after{content:"照片未匯入";position:absolute;font-size:11px;color:var(--muted)}
.ph .rm{position:absolute;right:3px;top:3px;width:28px;height:28px;border-radius:50%;background:var(--scrim);color:#fff;display:grid;place-items:center}
.ph .rm .ic{width:16px;height:16px;stroke-width:2.5}
.addph{flex:none;width:84px;height:84px;border-radius:10px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.addph.hl{border:0;background:var(--accent-soft);color:var(--accent);font-weight:700}
.ocrprog{display:flex;flex-direction:column;gap:10px;padding-block:8px}
.ocrprog .meter i{transition:width .2s}
.raw{width:100%;min-height:120px;font-size:14px}
details.more{display:block}
details.more summary{font-size:15px;color:var(--ink);font-weight:700}
details.more[open] summary{margin-bottom:4px}
details.more>*:not(summary){margin-top:12px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;font-weight:600;min-height:32px;display:flex;align-items:center}
.hint{font-size:13px;color:var(--muted)}
.gal{display:flex;gap:8px;overflow-x:auto;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal .ph{width:148px;height:148px;border-radius:12px}
.gal .ph .lb{position:absolute;left:6px;bottom:6px;background:var(--scrim);color:#fff;font-size:11px;padding:0 6px;border-radius:6px}
.phone-num{font-size:24px;font-weight:800;letter-spacing:.03em;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all;word-break:break-all}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.kv small{display:block;color:var(--muted);font-size:12px}
.kv b{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-word}
.kv .wide{grid-column:1/-1}
.prose{white-space:pre-wrap;word-break:break-word}
.qa{display:flex;flex-direction:column;gap:10px}
.qa>div small{display:block;color:var(--muted);font-size:12px;font-weight:700}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.log li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;font-size:14px}
.log time{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
.banner{display:flex;gap:10px;align-items:center;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px}
.banner p{flex:1;min-width:0}
.banner .btn{min-height:36px;font-size:14px;background:var(--surface);border-color:transparent}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
.empty h2{font-size:18px;font-weight:800;text-wrap:balance}
.steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;counter-increment:s}
.steps li::before{content:counter(s);width:26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:14px}
.steps b{display:block}
.steps span{color:var(--muted);font-size:14px}
.noresult{text-align:center;color:var(--muted);padding:32px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
#layer .scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:640px;margin:0 auto;background:var(--bg);border-radius:18px 18px 0 0;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet>header{display:flex;align-items:center;gap:8px;padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.sheet>header h2{flex:1;font-size:17px;font-weight:800;min-width:0}
.sheet>header p{font-size:13px;color:var(--muted)}
.sbody{overflow:auto;padding-block:4px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;overscroll-behavior:contain}
.sheet>footer{padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--surface);display:flex;gap:8px;border-radius:0}
.dlgwrap{position:fixed;inset:0;z-index:70;background:var(--scrim);display:grid;place-items:center;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.dlg{background:var(--surface);border-radius:16px;padding:20px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:12px}
.dlg h2{font-size:17px;font-weight:800}
.dlg p{color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px;font-size:14px;max-width:min(92vw,560px);width:max-content;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.toast p{flex:1;min-width:0}
.toast button{color:var(--accent-soft);font-weight:800;padding:6px 8px;border-radius:8px;white-space:nowrap}
:root[data-theme="dark"] .toast button{color:var(--accent)}
#viewer{position:fixed;inset:0;z-index:90;background:var(--viewer);color:var(--viewer-ink);display:flex;flex-direction:column}
#viewer .vtop{display:flex;align-items:center;gap:8px;padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#viewer .vtop p{flex:1;font-size:14px;opacity:.85}
#viewer .vimg{flex:1;min-height:0;display:grid;place-items:center}
#viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
#viewer .vnav{display:flex;justify-content:space-between;padding-block:8px calc(12px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
#viewer .ib{color:var(--viewer-ink)}
.ctable{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.ctable table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.ctable th,.ctable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.ctable tr:last-child>*{border-bottom:0}
.ctable th[scope=row]{position:sticky;left:0;background:var(--surface);color:var(--muted);font-weight:700;font-size:12px;width:64px;min-width:64px;white-space:nowrap;z-index:1}
.ctable td{min-width:112px;font-variant-numeric:tabular-nums;white-space:pre-wrap;word-break:break-word}
.ctable thead td{font-weight:700}
.ctable thead .ph{width:100%;height:84px;margin-bottom:6px}
.best{color:var(--ok);font-weight:800}
.best::after{content:" ▲";font-size:10px}
.setrow{display:flex;align-items:center;gap:10px;justify-content:space-between}
.setrow>div{min-width:0}
.setrow b{display:block}
.setrow small{color:var(--muted);font-size:13px}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok)}
.meter.hi i{background:var(--accent)}
.sticky-save{position:sticky;bottom:0}
.trash li{display:flex;align-items:center;gap:8px;justify-content:space-between}
.trash{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.cnt{font-variant-numeric:tabular-nums}
@media (min-width:700px){ .fab{right:calc(50% - 320px + 16px)} }
</style>
</head>
<body>


<div id="app">
  <header class="top" id="top"></header>
  <main id="main"></main>
</div>
<div id="bar"></div>
<div id="layer"></div>
<div id="dlg"></div>
<div id="viewer" hidden></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="filePhoto" accept="image/*" multiple hidden>
<input type="file" id="fileImport" accept=".json,application/json" hidden>
<input type="file" id="fileOcr" accept="image/*" hidden>

<script>
'use strict';
/* ========== 常數 ========== */
const STATUS = ['待聯繫','已聯繫未接','有空房','無空房','已約看房','已看房','考慮中','不考慮','已租出'];
const STATUS_CLS = {'待聯繫':'n','已聯繫未接':'a','有空房':'g','無空房':'x','已約看房':'b','已看房':'v','考慮中':'t','不考慮':'x','已租出':'x'};
const EXCLUDED = new Set(['無空房','不考慮','已租出']);
const ROOM_TYPES = ['獨立套房','分租套房','雅房','整層住家','其他'];
const SOURCES = ['路邊廣告','591','FB社團','朋友介紹','其他'];
const KINDS = {ext:'外觀', ad:'廣告/電話', room:'房間'};
const QUALITY = {save:{max:1200,q:.6,label:'省空間'}, std:{max:1600,q:.72,label:'標準'}, hi:{max:2048,q:.82,label:'清晰'}};
const TABS = [
  ['active','進行中', l => !EXCLUDED.has(l.status)],
  ['todo','待聯繫', l => l.status==='待聯繫' || l.status==='已聯繫未接'],
  ['due','該回電', l => isDue(l)],
  ['open','有空房', l => l.status==='有空房' || l.status==='已約看房'],
  ['seen','已看房', l => l.status==='已看房' || l.status==='考慮中'],
  ['fav','★ 優先', l => l.favorite],
  ['out','已排除', l => EXCLUDED.has(l.status)],
  ['all','全部', () => true],
];
const SORTS = {
  updated:['最近更新', (a,b)=>b.updatedAt-a.updatedAt],
  created:['最新建立', (a,b)=>b.createdAt-a.createdAt],
  rentAsc:['租金低→高', (a,b)=>cmpNull(num(a.rent),num(b.rent),1)],
  rentDesc:['租金高→低', (a,b)=>cmpNull(num(a.rent),num(b.rent),-1)],
  rating:['評分高→低', (a,b)=>cmpNull(a.visit.rating||null,b.visit.rating||null,-1)],
  moveIn:['可入住日早→晚', (a,b)=>cmpNull(a.moveIn||null,b.moveIn||null,1)],
  next:['下次聯絡時間', (a,b)=>cmpNull(a.call.nextContact||null,b.call.nextContact||null,1)],
};
const DEFAULT_FILTERS = {sort:'updated', rentMin:'', rentMax:'', ratingMin:'', roomType:'', area:'', scooter:'', pet:'', moveBy:'', status:''};

/* ========== 小工具 ========== */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const num = v => (v===''||v==null||isNaN(+v)) ? null : +v;
function cmpNull(a,b,dir){ if(a==null&&b==null) return 0; if(a==null) return 1; if(b==null) return -1; return (a<b?-1:a>b?1:0)*dir; }
const z2 = n => String(n).padStart(2,'0');
function localDate(d=new Date()){ return `${d.getFullYear()}-${z2(d.getMonth()+1)}-${z2(d.getDate())}`; }
function dtLocal(d){ return `${localDate(d)}T${z2(d.getHours())}:${z2(d.getMinutes())}`; }
function money(v){ const n=num(v); return n==null ? '' : n.toLocaleString('zh-TW'); }
function fmtD(s){ if(!s) return ''; const p=s.split('-'); return p.length===3 ? `${+p[1]}/${+p[2]}` : s; }
function fmtDT(s){ if(!s) return ''; const d=new Date(s); if(isNaN(d)) return s; return `${d.getMonth()+1}/${d.getDate()} ${z2(d.getHours())}:${z2(d.getMinutes())}`; }
function fmtTs(t){ const d=new Date(t); return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${z2(d.getHours())}:${z2(d.getMinutes())}`; }
function rel(t){ const s=(Date.now()-t)/1000; if(s<60) return '剛剛'; if(s<3600) return Math.floor(s/60)+' 分鐘前'; if(s<86400) return Math.floor(s/3600)+' 小時前'; if(s<86400*7) return Math.floor(s/86400)+' 天前'; const d=new Date(t); return `${d.getMonth()+1}/${d.getDate()}`; }
function kb(b){ return b>=1048576 ? (b/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(b/1024))+' KB'; }
function moveInText(s){ if(!s) return ''; return s<=localDate() ? '可立即入住' : fmtD(s)+' 起'; }
function telHref(p){ return 'tel:' + String(p||'').replace(/[^\d+]/g,''); }
function isDue(l){ return !!l.call.nextContact && !EXCLUDED.has(l.status) && new Date(l.call.nextContact).getTime() <= Date.now(); }
function nameOf(l){ return l.title || l.address || (l.phone ? '電話 '+l.phone : '未命名房源'); }
function perPing(l){ const r=num(l.rent), s=num(l.size); return (r && s) ? Math.round(r/s) : null; }
function getPath(o,p){ return p.split('.').reduce((a,k)=>a==null?a:a[k], o); }
function setPath(o,p,v){ const ks=p.split('.'); const last=ks.pop(); const t=ks.reduce((a,k)=>a[k],o); t[last]=v; }
const clone = o => JSON.parse(JSON.stringify(o));

const ICONS = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  phone:'<path d="M21.5 16.6v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.6 3.8 2 2 0 0 1 3.6 1.6h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L7.5 9.4a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.9 2.2z"/>',
  star:'<path d="M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  filter:'<path d="M3 6h18M6.5 12h11M10 18h4"/>',
  cols:'<rect x="3" y="4" width="7.5" height="16" rx="1.5"/><rect x="13.5" y="4" width="7.5" height="16" rx="1.5"/>',
  more:'<circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/>',
  camera:'<path d="M3 8.5a2 2 0 0 1 2-2h2.4L9 4.5h6l1.6 2H19a2 2 0 0 1 2 2V18a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.6"/>',
  trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  pin:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/>',
  home:'<path d="M3.5 11L12 4l8.5 7"/><path d="M5.5 9.5V20h13V9.5"/><path d="M10 20v-5h4v5"/>',
  left:'<path d="M15 18l-6-6 6-6"/>', right:'<path d="M9 18l6-6-6-6"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
};
const I = (n, cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n]}</svg>`;

/* ========== IndexedDB（照片用 Blob 存，不轉 base64） ========== */
const DB = {
  db:null, mem:null,
  async open(){
    try{
      if(!('indexedDB' in window)) throw new Error('no idb');
      this.db = await new Promise((res,rej)=>{
        const r = indexedDB.open('rentnote', 1);
        r.onupgradeneeded = () => { const d=r.result;
          d.createObjectStore('listings',{keyPath:'id'});
          const p=d.createObjectStore('photos',{keyPath:'id'}); p.createIndex('listingId','listingId');
          d.createObjectStore('meta',{keyPath:'k'}); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
    }catch(e){ this.mem = {listings:new Map(), photos:new Map(), meta:new Map()}; }
  },
  _req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); },
  _done(tx){ return new Promise((res,rej)=>{ tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); tx.onabort=()=>rej(tx.error||new Error('寫入失敗')); }); },
  async all(st){ if(this.mem) return [...this.mem[st].values()]; return this._req(this.db.transaction(st).objectStore(st).getAll()); },
  async get(st,id){ if(this.mem) return this.mem[st].get(id); return this._req(this.db.transaction(st).objectStore(st).get(id)); },
  async put(st,v){ if(this.mem){ this.mem[st].set(v.id ?? v.k, v); return; } const tx=this.db.transaction(st,'readwrite'); tx.objectStore(st).put(v); return this._done(tx); },
  async del(st,id){ if(this.mem){ this.mem[st].delete(id); return; } const tx=this.db.transaction(st,'readwrite'); tx.objectStore(st).delete(id); return this._done(tx); },
};

/* ========== 狀態 ========== */
const S = {
  listings:[], meta:{}, settings:{quality:'std'},
  q:'', tab:'active', filters:{...DEFAULT_FILTERS},
  compare:false, selected:new Set(),
  viewStack:[{name:'list'}], listScroll:0,
  draft:null, sheet:null, dialog:null, viewer:null, dial:null,
};
const THUMBS = new Map();

function blank(){
  const t=Date.now();
  return { id:uid(), createdAt:t, updatedAt:t, title:'', address:'', area:'', phone:'', landlord:'',
    rent:'', deposit:'', roomType:'', floor:'', size:'', moveIn:'', source:'路邊廣告', notes:'',
    status:'待聯繫', favorite:false, photos:[],
    call:{vacancy:'', utilities:'', mgmtFee:'', pet:'', scooter:'', landlordSays:'', nextContact:'', apptAt:''},
    visit:{rating:0, pros:'', cons:'', cautions:'', review:'', visitedAt:''},
    lat:null, lng:null, locAcc:null, locSrc:'',
    log:[], deletedAt:null };
}
function normalize(l){ const b=blank(); return {...b, ...l, call:{...b.call, ...(l.call||{})}, visit:{...b.visit, ...(l.visit||{})}, photos:Array.isArray(l.photos)?l.photos:[], log:Array.isArray(l.log)?l.log:[]}; }
const live = () => S.listings.filter(l=>!l.deletedAt);
const getL = id => S.listings.find(l=>l.id===id);

async function saveListing(l, touch=true){
  if(touch) l.updatedAt = Date.now();
  await DB.put('listings', l);
  const i = S.listings.findIndex(x=>x.id===l.id);
  if(i<0) S.listings.push(l); else S.listings[i]=l;
}
async function setMeta(k,v){ S.meta[k]=v; try{ await DB.put('meta',{k,v}); }catch(e){} }
function loadPrefs(){ try{ const p=JSON.parse(localStorage.getItem('rentnote.prefs')||'{}'); if(p.tab) S.tab=p.tab; if(p.filters) S.filters={...DEFAULT_FILTERS,...p.filters}; }catch(e){} }
function savePrefs(){ try{ localStorage.setItem('rentnote.prefs', JSON.stringify({tab:S.tab, filters:S.filters})); }catch(e){} }
async function requestPersist(){ try{ if(navigator.storage?.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); }catch(e){} }

/* ========== 返回鍵／圖層堆疊（Android 返回鍵可關閉視窗） ========== */
const Nav = { stack:[], hist:true };
function pushLayer(onClose){ Nav.stack.push(onClose); try{ history.pushState({rn:Nav.stack.length}, ''); }catch(e){ Nav.hist=false; } }
function back(){ if(!Nav.stack.length) return; if(Nav.hist) history.back(); else popLayer(); }
function popLayer(){ const fn=Nav.stack.pop(); if(fn) fn(); }
addEventListener('popstate', ()=>{
  if(S.dialog){ const d=S.dialog; closeDialog(); d.resolve(false); try{ history.pushState({rn:Nav.stack.length},''); }catch(e){} return; }
  if(Nav.stack.length) popLayer();
});

function openView(name, params={}){
  if(curView().name==='list') S.listScroll = scrollY;
  S.viewStack.push({name, ...params});
  pushLayer(()=>{ S.viewStack.pop(); renderView(); });
  renderView(true);
}
const curView = () => S.viewStack[S.viewStack.length-1];

/* ========== 主畫面切換 ========== */
function renderView(fresh){
  const v = curView();
  if(v.name==='list'){ renderList(); requestAnimationFrame(()=>scrollTo(0, S.listScroll)); return; }
  if(v.name==='detail') renderDetail(v.id);
  else if(v.name==='edit') renderEdit();
  else if(v.name==='compare') renderCompare();
  else if(v.name==='settings') renderSettings();
  if(fresh) scrollTo(0,0);
}

/* ---------- 列表 ---------- */
function activeFilterCount(){ const f=S.filters; return ['rentMin','rentMax','ratingMin','roomType','area','scooter','pet','moveBy','status'].filter(k=>f[k]!=='').length; }
function matches(l){
  const q=S.q.trim().toLowerCase();
  if(q){
    const hay=[l.title,l.address,l.area,l.notes,l.call.landlordSays,l.landlord,l.phone,String(l.phone).replace(/\D/g,''),l.roomType,l.visit.pros,l.visit.cons,l.visit.cautions,l.visit.review,l.status].join(' ').toLowerCase();
    if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;
  }
  const f=S.filters, rent=num(l.rent);
  if(f.rentMin!=='' && (rent==null || rent<+f.rentMin)) return false;
  if(f.rentMax!=='' && (rent==null || rent>+f.rentMax)) return false;
  if(f.ratingMin!=='' && (l.visit.rating||0) < +f.ratingMin) return false;
  if(f.roomType && l.roomType!==f.roomType) return false;
  if(f.area && l.area!==f.area) return false;
  if(f.scooter && l.call.scooter!=='有') return false;
  if(f.pet && l.call.pet!=='可') return false;
  if(f.moveBy && (!l.moveIn || l.moveIn>f.moveBy)) return false;
  if(f.status && l.status!==f.status) return false;
  return true;
}
function visibleListings(){
  const base = live().filter(matches);
  const tab = TABS.find(t=>t[0]===S.tab) || TABS[0];
  const sort = (SORTS[S.filters.sort]||SORTS.updated)[1];
  return { base, rows: base.filter(tab[2]).sort(sort) };
}

function renderList(){
  const n=live().length, fc=activeFilterCount();
  $('#top').innerHTML = `
    <div class="bar1">
      <div class="brand"><span class="tag" aria-hidden="true">租</span><div><h1>租屋筆記</h1><small class="cnt">${n} 筆房源・只存在這支手機</small></div></div>
      <button class="ib ${S.compare?'on':''}" data-act="cmp-mode" aria-label="勾選比較">${I('cols')}</button>
      <button class="ib" data-act="settings" aria-label="資料與備份">${I('more','fill')}</button>
    </div>
    <div class="bar2">
      <label class="search">${I('search')}<input id="q" type="search" enterkeyhint="search" placeholder="搜尋地址、備註、房東說法、電話" value="${esc(S.q)}" autocomplete="off"></label>
      <button class="fbtn ${fc?'on':''}" data-act="filters">${I('filter')}<span>${fc?'篩選 '+fc:'篩選'}</span></button>
    </div>
    <div class="chips" id="chips"></div>`;
  renderChips(); renderListBody(); renderBar();
}
function renderChips(){
  const {base}=visibleListings();
  $('#chips').innerHTML = TABS.map(([k,label,test])=>{
    const c=base.filter(test).length;
    if(k==='due' && !c && S.tab!=='due') return '';
    return `<button class="tabchip ${S.tab===k?'on':''}" data-act="tab" data-k="${k}">${label}<b>${c}</b></button>`;
  }).join('');
}
function backupBanner(){
  if(!live().length || DB.mem) return '';
  const lb=S.meta.lastBackup, snooze=S.meta.bannerSnooze||0;
  if(Date.now()<snooze) return '';
  if(lb && Date.now()-lb < 7*86400e3) return '';
  const msg = lb ? `上次備份是 ${Math.floor((Date.now()-lb)/86400e3)} 天前。` : '還沒備份過。';
  return `<div class="banner"><p>資料只存在這支手機的瀏覽器裡，${msg}</p><button class="btn" data-act="settings">去備份</button><button class="ib" data-act="snooze" aria-label="三天後再提醒">${I('x')}</button></div>`;
}
function renderListBody(){
  const main=$('#main');
  if(!live().length){
    main.innerHTML = `${DB.mem?`<div class="banner"><p>這個瀏覽器環境無法存到本機，關閉後資料會消失。請用一般瀏覽器開啟（不要用無痕模式）。</p></div>`:''}
    <div class="empty">
      <h2>把路上拍到的租屋資訊，整理成可以比較的清單</h2>
      <ol class="steps">
        <li><div><b>拍照記下</b><span>按右下「新增房源」，拍外觀和廣告電話，地址有就填，其他之後補。</span></div></li>
        <li><div><b>打電話初篩</b><span>卡片右邊的綠色按鈕直接撥號，講完回來點「記錄通話」寫下空房、租金、押金。</span></div></li>
        <li><div><b>去看房</b><span>看完用「記錄看房」打星等，寫下優點、缺點、注意事項。</span></div></li>
        <li><div><b>並排比較</b><span>右上角勾選 2～3 間，租金、每坪單價、機車位一次對照。</span></div></li>
      </ol>
      <div class="row"><button class="btn primary grow" data-act="add">${I('camera')}新增第一筆房源</button><button class="btn ghost" data-act="sample">載入範例</button></div>
    </div>`;
    return;
  }
  const {rows}=visibleListings();
  const sortLabel=(SORTS[S.filters.sort]||SORTS.updated)[0];
  const fc=activeFilterCount();
  main.innerHTML = `${backupBanner()}
    <div class="meta-line"><span class="cnt">${rows.length} 筆・${sortLabel}</span>${fc||S.q?`<button data-act="clear-filters">清除搜尋與篩選</button>`:`<button data-act="filters">排序</button>`}</div>
    ${rows.length ? `<div class="list">${rows.map(card).join('')}</div>` :
      `<div class="noresult"><p>這個分頁沒有符合條件的房源。</p>${fc||S.q?'<button class="btn" data-act="clear-filters">清除搜尋與篩選</button>':''}</div>`}`;
  hydrate(main);
}
function card(l){
  const cover = l.photos.find(p=>p.kind==='ext') || l.photos[0];
  const sel = S.selected.has(l.id);
  const misses = l.status==='已聯繫未接' ? l.log.filter(e=>e.text==='撥打未接').length : 0;
  const due = isDue(l);
  const metaBits=[l.roomType, l.floor, l.size?l.size+'坪':''].filter(Boolean).join('・');
  const sub=[l.area, l.address && l.title ? l.address : '', rel(l.updatedAt)+'更新'].filter(Boolean).join('・');
  return `<article class="card ${sel?'sel':''} ${EXCLUDED.has(l.status)?'dim':''}" data-act="open" data-id="${l.id}">
    <div class="thumb">${cover?`<img data-pid="${cover.id}" alt="">`:I('home')}${l.photos.length>1?`<span class="n">${l.photos.length}</span>`:''}${S.compare?`<span class="check">${sel?I('check'):''}</span>`:''}</div>
    <div class="cbody">
      <div class="crow1"><h3>${esc(nameOf(l))}</h3>${l.favorite?I('star','on'):''}</div>
      <div class="crow2">${num(l.rent)!=null?`<span class="rent">${money(l.rent)}<small>元/月</small></span>`:`<span class="rent unk">租金未問</span>`}<span class="meta">${esc(metaBits)}</span></div>
      <div class="crow3"><span class="pill ${STATUS_CLS[l.status]}">${l.status}${misses>1?` ×${misses}`:''}</span>${due?'<span class="pill due">該回電</span>':''}${l.visit.rating?`<span class="mini st">★${l.visit.rating}</span>`:''}${l.call.scooter==='有'?'<span class="mini">機車位</span>':''}${l.moveIn?`<span class="mini">${moveInText(l.moveIn)}</span>`:''}</div>
      <div class="sub">${esc(sub)}</div>
    </div>
    ${l.phone && !S.compare ? `<a class="callbtn" href="${telHref(l.phone)}" data-act="dial" data-id="${l.id}" aria-label="撥打 ${esc(l.phone)}">${I('phone')}</a>` : '<span></span>'}
  </article>`;
}
function renderBar(){
  const v=curView().name, bar=$('#bar');
  if(v==='list'){
    if(!live().length){ bar.innerHTML=''; return; }
    bar.innerHTML = S.compare

const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>{ for(const e of es) if(e.isIntersecting){ io.unobserve(e.target); loadThumb(e.target); } }, {rootMargin:'400px'}) : null;
function hydrate(root){ root.querySelectorAll('img[data-pid]:not([src])').forEach(img => io ? io.observe(img) : loadThumb(img)); }
async function getPhotoRec(pid){ return S.draft?.pending.get(pid) || await DB.get('photos', pid); }
async function loadThumb(img){
  const pid=img.dataset.pid;
  let url=THUMBS.get(pid);
  if(!url){ const rec=await getPhotoRec(pid); if(rec?.thumb){ url=URL.createObjectURL(rec.thumb); THUMBS.set(pid,url); } }
  if(url) img.src=url; else { img.remove(); }
}

async function addPhotos(files, kind){
  const d=S.draft; if(!d) return;
  const list=[...files].filter(f=>f.type.startsWith('image/') || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  if(!list.length) return;
  toast(`正在壓縮 ${list.length} 張照片…`, {ms:60000});
  let ok=0;
  let gotGps=false, triedExt=false;
  for(const f of list){
    if(d.l.lat==null){ const g=await readGps(f); if(g){ setDraftLoc(g.lat,g.lng,null,'photo'); gotGps=true; } else if(kind==='ext') triedExt=true; }
    try{
      const {blob,thumb}=await compress(f);
      const id=uid();
      d.pending.set(id, {id, listingId:d.l.id, kind, blob, thumb, bytes:blob.size+thumb.size, createdAt:Date.now()});
      d.l.photos.push({id, kind, bytes:blob.size+thumb.size});
      ok++;
    }catch(e){ console.warn(e); }
  }
  d.dirty=true; renderPhotoEdit();
  if(gotGps){ toast('從照片讀到拍攝位置'); fillAddrFromLoc(); return; }
  if(triedExt && !S.noGpsHinted && d.l.lat==null){ S.noGpsHinted=true; toast('這張照片沒有位置資訊（手機上傳時常被移除）。可以按「用目前位置」。', {ms:6000}); return; }
  const est = await storageEst();
  if(est && est.quota && est.usage/est.quota>0.8) toast('手機給這個工具的空間快滿了，建議先備份並改用「省空間」畫質。', {ms:7000});
  else toast(ok===list.length ? `已加入 ${ok} 張` : `加入 ${ok} 張，${list.length-ok} 張無法讀取`);
}
function loadImg(url){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>rej(new Error('無法讀取圖片')); im.src=url; }); }
function drawTo(img, max, q){
  const w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1, max/Math.max(w,h));
  const c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('壓縮失敗')),'image/jpeg',q));
}
async function compress(file){
  const url=URL.createObjectURL(file);
  try{ const img=await loadImg(url); const cfg=QUALITY[S.settings.quality]||QUALITY.std;
    return { blob: await drawTo(img,cfg.max,cfg.q), thumb: await drawTo(img,360,.7) };
  } finally { URL.revokeObjectURL(url); }
}

/* ---------- 位置：照片 GPS、目前位置、座標轉地址 ---------- */
function mapUrl(l){ return 'https://www.google.com/maps/search/?api=1&query=' + (l.lat!=null ? `${l.lat},${l.lng}` : encodeURIComponent(l.address)); }
async function readGps(file){
  try{
    const v=new DataView(await file.slice(0, 256*1024).arrayBuffer());
    if(v.byteLength<4 || v.getUint16(0)!==0xFFD8) return null;
    let o=2;
    while(o+10<v.byteLength){
      const mk=v.getUint16(o); if((mk&0xFF00)!==0xFF00) return null;
      if(mk===0xFFDA || mk===0xFFD9) return null;
      const len=v.getUint16(o+2);
      if(mk===0xFFE1 && v.getUint32(o+4)===0x45786966) return exifGps(v, o+10);
      o+=2+len;
    }
  }catch(e){}
  return null;
}
function exifGps(v,t){
  const le=v.getUint16(t)===0x4949, u16=p=>v.getUint16(p,le), u32=p=>v.getUint32(p,le);
  const ifd0=t+u32(t+4); let gps=null;
  for(let i=0,n=u16(ifd0);i<n;i++){ const e=ifd0+2+i*12; if(u16(e)===0x8825) gps=t+u32(e+8); }
  if(gps==null) return null;
  const g={};
  for(let i=0,n=u16(gps);i<n;i++){
    const e=gps+2+i*12, tag=u16(e), type=u16(e+2), cnt=u32(e+4);
    if(tag===1||tag===3) g[tag]=String.fromCharCode(v.getUint8(e+8));
    else if((tag===2||tag===4) && type===5 && cnt===3){ const p=t+u32(e+8), r=k=>u32(p+k*8)/u32(p+k*8+4); g[tag]=r(0)+r(1)/60+r(2)/3600; }
  }
  if(g[2]==null||g[4]==null) return null;
  const lat=g[2]*(g[1]==='S'?-1:1), lng=g[4]*(g[3]==='W'?-1:1);
  if(!isFinite(lat)||!isFinite(lng)||(lat===0&&lng===0)) return null;
  return {lat:+lat.toFixed(6), lng:+lng.toFixed(6)};
}
function getHere(){
  return new Promise((res,rej)=>{
    if(!navigator.geolocation) return rej(new Error('nogeo'));
    navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy)}), rej, {enableHighAccuracy:true, timeout:20000, maximumAge:30000});
  });
}
function twAddress(a){
  const city=a.city||a.county||a.state||'';
  let dist=a.town||a.city_district||a.district||a.suburb||'';
  if(dist===city) dist='';
  const hn=a.house_number ? a.house_number+(/號$/.test(a.house_number)?'':'號') : '';
  const road=a.road||a.pedestrian||'';
  return {text:[city,dist,road,hn].join(''), hasRoad:!!road, hasNum:!!hn};
}
async function revGeo(lat,lng){
  const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1&accept-language=zh-TW`);
  if(!r.ok) throw new Error('http '+r.status);
  const j=await r.json(); const a=twAddress(j.address||{});
  return a.text ? a : {text:j.display_name||'', hasRoad:false, hasNum:false};
}
function setDraftLoc(lat,lng,acc,src){ const l=S.draft?.l; if(!l) return; l.lat=lat; l.lng=lng; l.locAcc=acc; l.locSrc=src; S.draft.dirty=true; renderLocBox(); }

      <p class="hint">在現場按「用目前位置」；事後補登用 Google 相簿位置資訊的截圖。</p>`;

  }

/* ---------- 廣告照片辨識（OCR，照片不保存） ---------- */
function fmtTWPhone(d){
  if(/^09\d{8}$/.test(d)) return d.slice(0,4)+'-'+d.slice(4,7)+'-'+d.slice(7);
  if(/^02\d{8}$/.test(d)) return '02-'+d.slice(2,6)+'-'+d.slice(6);
  if(/^(037|049|082|089)/.test(d) && d.length===9) return d.slice(0,3)+'-'+d.slice(3);
  return d.slice(0,2)+'-'+d.slice(2);
}
function parseAd(raw){
  let t=String(raw||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/\r/g,'');
  t=t.replace(/([㐀-鿿])[ \t]+(?=[㐀-鿿])/g,'$1');
  const text=t.split('\n').map(s=>s.trim()).filter(Boolean).join('\n');
  const d=text.replace(/[OoＯ〇]/g,'0').replace(/[Il|丨]/g,'1').replace(/[Ss]/g,'5').replace(/[Bb]/g,'8');
  const phones=[], used=[];
  const runRe=/(?:\+?[ \t]*886[ \t\-.]*)?[0-9][0-9 \t\-－—–.．·•()（）]{6,22}[0-9]/g;
  let m;
  while((m=runRe.exec(d))){
    let ds=m[0].replace(/\D/g,'');
    if(ds.startsWith('886')) ds='0'+ds.slice(3);
    const mob=ds.match(/09\d{8}/g);
    if(mob){ mob.forEach(x=>phones.push(x)); used.push(m[0]); continue; }
    if(/^0[2-8]\d{7,8}$/.test(ds)){ phones.push(ds); used.push(m[0]); }
  }
  const uniq=a=>[...new Set(a)];
  const names=[], bad=/[洽電話請找打聯絡來]/;
  for(const x of text.matchAll(/([一-鿿])\s*(先生|小姐|太太|女士|媽媽|阿姨|伯伯|大哥|大姐|老闆娘|老闆)/g)) if(!bad.test(x[1])) names.push(x[1]+x[2]);
  for(const x of text.matchAll(/(?:聯絡人|聯絡|洽詢|洽|房東)\s*[:：]?\s*([一-鿿]{2,3})/g)){ const n=x[1]; if(!/電話|手機|先生|小姐|出租|專線/.test(n) && !names.some(v=>v.startsWith(n[0]))) names.push(n); }
  let r=d; used.forEach(u=>{ r=r.replace(u,' '); });
  const rents=[], toN=s=>+s.replace(/[,，.]/g,'');
  for(const x of r.matchAll(/(?:月租|租金|每月|月)\s*[:：]?\s*\$?\s*(\d{1,2}[,，.]?\d{3})/g)) rents.push(toN(x[1]));
  for(const x of r.matchAll(/(\d{1,2}[,，]?\d{3})\s*(?:元|\/月|／月|起)/g)) rents.push(toN(x[1]));
  for(const x of r.matchAll(/(\d{1,2}(?:\.\d)?)\s*[kK千]/g)) rents.push(Math.round(parseFloat(x[1])*1000));
  // 相簿截圖：座標、地址、拍攝時間
  let coord=null;
  for(const x of text.matchAll(/(-?\d{1,2}\.\d{2,7})\s*[,，]\s*(-?\d{1,3}\.\d{2,7})/g)){
    const la=+x[1], ln=+x[2];
    if(la>=21 && la<=26.5 && ln>=118 && ln<=122.5){ const dec=Math.min(x[1].split('.')[1].length, x[2].split('.')[1].length); coord={lat:la, lng:ln, acc:Math.round(111000*Math.pow(10,-dec))}; break; }
  }
  const am=text.replace(/\s+/g,'').match(/(?:臺|台)?[一-鿿]{1,2}[縣市][一-鿿]{1,4}?[鄉鎮市區][一-鿿0-9之\-]*?(?:里|村|路|街|段|巷|弄|號)(?:[一-鿿0-9之\-]*?(?:路|街|段|巷|弄|號))*/);
  const tm=text.match(/(?:IMG|PXL|VID|Screenshot)?[_\-]?(20\d{2})(\d{2})(\d{2})[_\-]?(\d{2})(\d{2})(\d{2})/);
  let shotTime='';
  if(tm && +tm[2]>=1 && +tm[2]<=12 && +tm[3]>=1 && +tm[3]<=31 && +tm[4]<24) shotTime=`${tm[1]}/${+tm[2]}/${+tm[3]} ${tm[4]}:${tm[5]}`;
  return { phones:uniq(phones).map(fmtTWPhone), names:uniq(names), rents:uniq(rents.filter(n=>n>=2000&&n<=80000)), coord, addr:am?am[0]:'', shotTime, text };
}
const OCR = { worker:null, booting:null, onProg:null };
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>rej(new Error('script')); document.head.appendChild(s); }); }
async function getOcrWorker(){
  if(OCR.worker) return OCR.worker;
  if(!OCR.booting) OCR.booting=(async()=>{
    if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@6.0.1/dist/tesseract.min.js');
    OCR.worker = await Tesseract.createWorker('chi_tra', 1, { logger: m => OCR.onProg && OCR.onProg(m) });
    return OCR.worker;
  })().catch(e=>{ OCR.booting=null; throw e; });
  return OCR.booting;
}
async function prepForOcr(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await loadImg(url);
    const w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1, 1800/Math.max(w,h));
    const c=document.createElement('canvas'); c.width=Math.round(w*s); c.height=Math.round(h*s);
    const x=c.getContext('2d'); x.filter='grayscale(1) contrast(1.25)'; x.drawImage(img,0,0,c.width,c.height);
    return c;
  } finally { URL.revokeObjectURL(url); }
}
function ocrProgress(label, pct){
  const box=$('#ocrBox'); if(!box) return;
  box.innerHTML=`<b>${esc(label)}</b><div class="meter"><i style="width:${Math.max(3,Math.round(pct*100))}%"></i></div><p class="hint">第一次使用要下載約 2MB 的中文辨識模型，之後會快很多。照片只拿來辨識，不會存下來。</p>`;
}
async function runOcr(file){
  const d=S.draft; if(!d) return;
  const token={};
  openSheet('辨識圖片', '', `<div class="ocrprog" id="ocrBox"></div>`, {footer:`<button class="btn ghost grow" data-act="back">取消</button>`});
  S.sheet.token=token;
  S.sheet.imgUrl=URL.createObjectURL(file);
  ocrProgress('準備中…', .02);
  OCR.onProg = m => {
    if(S.sheet?.token!==token) return;
    if(/load|initializ/i.test(m.status)) ocrProgress('載入辨識模型…', (m.progress||0)*.4);
    else if(/recogniz/i.test(m.status)) ocrProgress('辨識文字中…', .4+(m.progress||0)*.6);
  };
  let text='';
  if(d.l.lat==null){ const g=await readGps(file); if(g){ setDraftLoc(g.lat,g.lng,null,'photo'); fillAddrFromLoc(); } }
  try{
    const canvas=await prepForOcr(file);
    const w=await getOcrWorker();
    if(S.sheet?.token!==token) return;
    ocrProgress('辨識文字中…', .45);
    text=(await w.recognize(canvas)).data.text;
  }catch(e){
    console.warn(e);
    if(S.sheet?.token!==token) return;
    $('#ocrBox').innerHTML=`<b>辨識失敗</b><p class="hint">${navigator.onLine===false?'目前沒有網路。第一次辨識需要上網下載辨識模型，連上網後再試一次。':'無法載入辨識功能或讀取這張圖。請確認有網路，或換一張照片再試。'}</p>`;
    return;
  }
  if(S.sheet?.token!==token) return;
  showOcrResult(parseAd(text));
}
function showOcrResult(p){
  const l=S.draft.l;
  const isShot=!!(p.coord||p.addr) && !p.phones.length;
  const o={phone:p.phones[0]||'', landlord:p.names[0]||'', rent:p.rents[0]!=null?String(p.rents[0]):'', addNote:'', addr:p.addr||'', useCoord:p.coord?'1':''};

  const nothing=!p.phones.length&&!p.names.length&&!p.rents.length&&!p.coord&&!p.addr;
  const locHTML=(p.coord||p.addr||p.shotTime)?`<div class="sec" style="padding:12px;gap:10px"><h2>位置（相簿截圖）</h2>
      ${p.coord?`<div class="fld"><span>座標 <em>精度約 ${p.coord.acc} 公尺</em></span>${chipGroup('useCoord',[['1',`${p.coord.lat}, ${p.coord.lng}`]],o.useCoord)}<a class="hint" href="https://www.google.com/maps/search/?api=1&query=${p.coord.lat},${p.coord.lng}" target="_blank" rel="noopener">在地圖上確認</a></div>`:''}
      <label class="fld"><span>地址${l.address?` <em>會取代目前的「${esc(l.address)}」</em>`:''}</span><input type="text" data-f="addr" value="${esc(o.addr)}" placeholder="沒辨識到，可以手動填" autocomplete="off"></label>
      ${p.shotTime?`<p class="hint">照片拍攝於 ${esc(p.shotTime)}，會記到備註。</p>`:''}</div>`:'';
  const phoneHTML=`<label class="fld"><span>房東電話${p.phones.length>1?` <em>找到 ${p.phones.length} 組，點選要用的</em>`:''}</span><input type="tel" id="ocrPhone" data-f="phone" value="${esc(o.phone)}" inputmode="tel" autocomplete="off"></label>
    ${pick('ocrPhone',p.phones)}
    <label class="fld"><span>聯絡人</span><input type="text" id="ocrName" data-f="landlord" value="${esc(o.landlord)}" placeholder="沒辨識到" autocomplete="off"></label>
    ${pick('ocrName',p.names)}
    <label class="fld"><span>租金 <em>廣告上有寫才會抓到</em></span><input type="number" id="ocrRent" data-f="rent" value="${esc(o.rent)}" inputmode="numeric" placeholder="沒辨識到" autocomplete="off"></label>
    ${pick('ocrRent',p.rents.map(String))}
    ${p.phones.length>1?`<p class="hint">另一組號碼會一起記到備註。</p>`:''}`;
  const body=`
    ${nothing?`<div class="banner"><p>沒找到電話、聯絡人或位置。可以拍近一點、正一點再試，或看下方辨識文字手動填。</p></div>`:`<p class="hint">請對照原圖逐碼核對，辨識可能有錯字。按「套用」會填進房源表單。</p>`}
    <details ${isShot?'':'open'}><summary>原圖（只用來比對，不會存）</summary><img src="${S.sheet.imgUrl}" alt="辨識的圖片" style="width:100%;max-height:46vh;object-fit:contain;border-radius:10px;background:var(--sunk)"></details>
    ${isShot ? locHTML + `<details><summary>電話／聯絡人（截圖通常不用填）</summary><div style="display:flex;flex-direction:column;gap:12px;padding-top:8px">${phoneHTML}</div></details>` : phoneHTML + locHTML}
    <div class="fld"><span>辨識到的全部文字</span>${chipGroup('addNote',[['1','也加到備註']],'')}
      <details><summary>展開查看</summary><textarea class="raw" readonly>${esc(p.text||'（沒有辨識到文字）')}</textarea></details></div>`;
  $('#layer .sheet .sbody').innerHTML=body;
  $('#layer .sheet footer').innerHTML=`<button class="btn ghost" data-act="ocr-again">重拍</button><button class="btn primary grow" data-act="sheet-save">套用</button>`;
  S.sheet.obj=o;
  S.sheet.onSave=async o=>{
    const dl=S.draft?.l; if(!dl) return;
    if(o.phone.trim()) dl.phone=o.phone.trim();
    if(o.landlord.trim()) dl.landlord=o.landlord.trim();
    if(o.rent!=='' && num(o.rent)!=null) dl.rent=String(num(o.rent));
    if(o.useCoord && p.coord){ dl.lat=p.coord.lat; dl.lng=p.coord.lng; dl.locAcc=p.coord.acc; dl.locSrc='shot'; }
    if(o.addr.trim()) dl.address=o.addr.trim();
    const extra=p.phones.filter(x=>x!==dl.phone);
    const add=[];
    if(p.shotTime) add.push('照片拍攝：'+p.shotTime);
    if(extra.length) add.push('廣告上其他電話：'+extra.join('、'));
    if(o.addNote && p.text) add.push('【廣告文字】\n'+p.text);
    if(add.length) dl.notes=[dl.notes, ...add].filter(Boolean).join('\n');
    S.draft.dirty=true;
    toast('已填入，記得按「儲存房源」');
  };
}

/* ---------- 比較 ---------- */
function renderCompare(){
  const ls=[...S.selected].map(getL).filter(l=>l && !l.deletedAt);
  $('#top').innerHTML = `<div class="bar1"><button class="ib" data-act="back" aria-label="返回">${I('back')}</button><div class="ttl">並排比較（${ls.length} 間）</div></div>`;
  const best=(fn,dir)=>{ const vals=ls.map(fn).filter(v=>v!=null); if(vals.length<2) return null; return dir<0?Math.min(...vals):Math.max(...vals); };
  const bRent=best(l=>num(l.rent),-1), bPP=best(perPing,-1), bRate=best(l=>l.visit.rating||null,1), bSize=best(l=>num(l.size),1);
  const R=[
    ['租金', l=>num(l.rent)!=null?money(l.rent)+' 元':'—', l=>num(l.rent)===bRent],
    ['押金', l=>l.deposit||'—'],
    ['管理費', l=>l.call.mgmtFee?money(l.call.mgmtFee)+' 元':'—'],
    ['水電', l=>l.call.utilities||'—'],
    ['房型', l=>l.roomType||'—'],
    ['樓層', l=>l.floor||'—'],
    ['坪數', l=>l.size?l.size+' 坪':'—', l=>num(l.size)===bSize],
    ['每坪租金', l=>perPing(l)?money(perPing(l))+' 元':'—', l=>perPing(l)===bPP],
    ['可入住', l=>moveInText(l.moveIn)||'—'],
    ['機車位', l=>l.call.scooter||'—'],
    ['寵物', l=>l.call.pet||'—'],
    ['評分', l=>l.visit.rating?'★'.repeat(l.visit.rating):'未評', l=>(l.visit.rating||null)===bRate],
    ['優點', l=>l.visit.pros||'—'],
    ['缺點', l=>l.visit.cons||'—'],
    ['注意事項', l=>l.visit.cautions||'—'],
    ['房東說法', l=>l.call.landlordSays||'—'],
    ['位置', l=>[l.area,l.address].filter(Boolean).join('・')||'—'],
    ['狀態', l=>l.status],
    ['電話', l=>l.phone||'—'],
  ];
  $('#main').innerHTML = ls.length<2 ? `<p class="hint">至少要選 2 間才能比較。</p>` : `
    <div class="ctable"><table>
      <thead><tr><th scope="row"></th>${ls.map(l=>{ const cv=l.photos.find(p=>p.kind==='ext')||l.photos[0]; return `<td><button data-act="open-detail" data-id="${l.id}" style="text-align:left;width:100%"><div class="ph">${cv?`<img data-pid="${cv.id}" alt="">`:I('home')}</div>${esc(nameOf(l))}</button></td>`; }).join('')}</tr></thead>
      <tbody>${R.filter(([lab,fn])=>['租金','評分','優點','缺點','狀態'].includes(lab) || ls.some(l=>fn(l)!=='—')).map(([lab,fn,isBest])=>`<tr><th scope="row">${lab}</th>${ls.map(l=>`<td class="${isBest&&isBest(l)?'best':''}">${esc(fn(l))}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    <p class="hint">綠色 ▲ 是這幾間裡最好的一項（租金、每坪租金取低，坪數、評分取高）。點上方照片可開啟房源。</p>`;
  hydrate($('#main')); renderBar();
}

/* ---------- 匯出／匯入 ---------- */
function blobToDataURL(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); }); }
function dataURLToBlob(d){ const [h,b64]=d.split(','); const mime=(h.match(/data:([^;]+)/)||[])[1]||'image/jpeg'; const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new Blob([u],{type:mime}); }
function stamp(){ const d=new Date(); return `${d.getFullYear()}${z2(d.getMonth()+1)}${z2(d.getDate())}-${z2(d.getHours())}${z2(d.getMinutes())}`; }
async function deliver(blob, name, share){
  if(share){
    try{ await navigator.share({files:[new File([blob],name,{type:blob.type})], title:name}); return true; }
    catch(e){ if(e && e.name==='AbortError') return false; toast('這裡無法分享，改用下載'); }
  }
  try{
    const url=URL.createObjectURL(blob); const a=document.createElement('a');
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 30000); return true;
  }catch(e){ toast('這個環境不允許下載檔案'); return false; }
}
async function exportJSON(withPhotos, share){
  const ls=live();
  if(!ls.length){ toast('目前沒有房源可備份'); return; }
  toast('正在打包備份…', {ms:60000});
  const parts=['{"app":"rentnote","version":1,"exportedAt":', JSON.stringify(new Date().toISOString()), ',"withPhotos":', String(!!withPhotos), ',"listings":', JSON.stringify(ls), ',"photos":['];
  let first=true, n=0;
  if(withPhotos){
    for(const l of ls) for(const p of l.photos){
      const rec=await DB.get('photos',p.id); if(!rec) continue;
      parts.push((first?'':',') + JSON.stringify({id:rec.id, listingId:rec.listingId, kind:rec.kind, createdAt:rec.createdAt, bytes:rec.bytes, data:await blobToDataURL(rec.blob), thumb:await blobToDataURL(rec.thumb)}));
      first=false; n++;
    }
  }
  parts.push(']}');
  const blob=new Blob(parts,{type:'application/json'});
  const ok=await deliver(blob, `租屋筆記備份_${stamp()}${withPhotos?'':'_無照片'}.json`, share);
  if(ok){ if(withPhotos) await setMeta('lastBackup', Date.now()); toast(`備份完成：${ls.length} 筆房源${withPhotos?`、${n} 張照片`:''}（${kb(blob.size)}）`, {ms:5000}); }
}
async function exportCSV(){
  const ls=live(); if(!ls.length){ toast('目前沒有房源'); return; }
  const cols=[['簡稱',l=>l.title],['地址/位置',l=>l.address],['生活圈',l=>l.area],['電話',l=>l.phone],['房東',l=>l.landlord],['狀態',l=>l.status],['優先',l=>l.favorite?'★':''],
    ['租金',l=>l.rent],['押金',l=>l.deposit],['管理費',l=>l.call.mgmtFee],['水電',l=>l.call.utilities],['房型',l=>l.roomType],['樓層',l=>l.floor],['坪數',l=>l.size],['每坪租金',l=>perPing(l)??''],
    ['可入住日',l=>l.moveIn],['機車位',l=>l.call.scooter],['寵物',l=>l.call.pet],['評分',l=>l.visit.rating||''],['優點',l=>l.visit.pros],['缺點',l=>l.visit.cons],['注意事項',l=>l.visit.cautions],['看房心得',l=>l.visit.review],
    ['房東說法',l=>l.call.landlordSays],['約看時間',l=>l.call.apptAt.replace('T',' ')],['下次聯絡',l=>l.call.nextContact.replace('T',' ')],['來源',l=>l.source],['座標',l=>l.lat!=null?`${l.lat},${l.lng}`:''],['備註',l=>l.notes],['照片數',l=>l.photos.length],['建立',l=>fmtTs(l.createdAt)],['更新',l=>fmtTs(l.updatedAt)]];
  const q=v=>{ const s=String(v??''); return /[",\n\r]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
  const csv='﻿'+[cols.map(c=>c[0]).join(','), ...ls.map(l=>cols.map(c=>q(c[1](l))).join(','))].join('\r\n');
  if(await deliver(new Blob([csv],{type:'text/csv;charset=utf-8'}), `租屋筆記_${stamp()}.csv`)) toast(`已匯出 ${ls.length} 筆`);
}
async function importFile(file){
  let data;
  try{ data=JSON.parse(await file.text()); }catch(e){ toast('讀不懂這個檔案，請選「租屋筆記備份_….json」'); return; }
  if(!data || data.app!=='rentnote' || !Array.isArray(data.listings)){ toast('這不是租屋筆記的備份檔'); return; }
  toast('匯入中…',{ms:60000});
  let added=0, updated=0, kept=0, ph=0;
  try{
    for(const p of (data.photos||[])){
      if(await DB.get('photos',p.id)) continue;
      const blob=dataURLToBlob(p.data), thumb=dataURLToBlob(p.thumb||p.data);
      await DB.put('photos',{id:p.id, listingId:p.listingId, kind:p.kind, blob, thumb, bytes:blob.size+thumb.size, createdAt:p.createdAt||Date.now()}); ph++;
    }
    for(const raw of data.listings){
      const l=normalize(raw); const ex=getL(l.id);
      if(!ex){ await saveListing(l,false); added++; }
      else if(l.updatedAt>ex.updatedAt){ await saveListing(l,false); updated++; }
      else kept++;
    }
  }catch(e){ toast('匯入到一半失敗，可能是手機空間不足', {ms:6000}); renderView(); return; }
  toast(`匯入完成：新增 ${added}、更新 ${updated}、略過 ${kept} 筆，照片 ${ph} 張`, {ms:6000});
  renderView();
}

/* ---------- 刪除與復原 ---------- */
async function softDelete(id){
  const l=getL(id); if(!l) return;
  const ok=await confirmDlg({title:'刪除這筆房源？', body:`「${nameOf(l)}」會移到「最近刪除」，30 天內可以復原。`, ok:'刪除', danger:true});
  if(!ok) return;
  l.deletedAt=Date.now(); await saveListing(l,false);
  S.selected.delete(id);
  if(curView().name==='detail') back(); else renderView();
  toast('已刪除', {action:{label:'復原', fn:()=>restore(id)}, ms:7000});
}
async function restore(id){ const l=getL(id); if(!l) return; l.deletedAt=null; await saveListing(l,false); toast('已復原'); renderView(); }
async function hardDelete(l){ for(const p of l.photos){ await DB.del('photos',p.id); THUMBS.delete(p.id); } await DB.del('listings',l.id); S.listings=S.listings.filter(x=>x.id!==l.id); }
async function purgeOld(){ const cut=Date.now()-30*86400e3; for(const l of S.listings.filter(l=>l.deletedAt && l.deletedAt<cut)) await hardDelete(l); }

function confirmDlg({title, body='', ok='確定', cancel='取消', danger=false}){
  return new Promise(resolve=>{
    S.dialog={resolve};
    $('#dlg').innerHTML=`<div class="dlgwrap" role="alertdialog" aria-label="${esc(title)}"><div class="dlg"><h2>${esc(title)}</h2>${body?`<p>${esc(body)}</p>`:''}<div class="row"><button class="btn ghost grow" data-act="dlg" data-v="0">${esc(cancel)}</button><button class="btn ${danger?'primary':'dark'} grow" data-act="dlg" data-v="1">${esc(ok)}</button></div></div></div>`;
    $('#dlg [data-v="0"]').focus();
  });
}
function closeDialog(){ S.dialog=null; $('#dlg').innerHTML=''; }
let toastTimer=null;
function toast(msg, {action=null, ms=3200}={}){
  const t=$('#toast'); clearTimeout(toastTimer);
  t.innerHTML=`<p>${esc(msg)}</p>${action?`<button data-act="toast-act">${esc(action.label)}</button>`:''}`;
  t._fn=action?.fn||null; t.hidden=false;
  toastTimer=setTimeout(()=>{ t.hidden=true; t._fn=null; }, ms);
}
async function openViewer(pids, i){
  S.viewer={pids, i, url:null};
  $('#viewer').hidden=false; await renderViewer();
  pushLayer(()=>{ if(S.viewer?.url) URL.revokeObjectURL(S.viewer.url); S.viewer=null; const v=$('#viewer'); v.hidden=true; v.innerHTML=''; });
}
async function renderViewer(){
  const v=S.viewer; if(!v) return;
  const rec=await getPhotoRec(v.pids[v.i]);
  if(v.url) URL.revokeObjectURL(v.url);
  v.url = rec ? URL.createObjectURL(rec.blob) : null;
  $('#viewer').innerHTML=`<div class="vtop"><p>${v.i+1} / ${v.pids.length}${rec?`・${KINDS[rec.kind]||''}・${kb(rec.bytes||0)}`:''}</p><button class="ib" data-act="back" aria-label="關閉">${I('x')}</button></div>

function formOf(el){ const h=el.closest('[data-form]'); return h ? h.dataset.form : null; }
function objOf(form){ return form==='draft'?S.draft?.l : form==='sheet'?S.sheet?.obj : form==='filters'?S.filters : form==='settings'?S.settings : null; }
function afterChange(form){
  if(form==='draft' && S.draft) S.draft.dirty=true;
  else if(form==='filters'){ savePrefs(); renderChips(); renderListBody(); updateFilterCount(); const fc=activeFilterCount(); const b=$('.fbtn'); if(b){ b.classList.toggle('on',!!fc); b.querySelector('span').textContent=fc?'篩選 '+fc:'篩選'; } }
  else if(form==='settings') setMeta('settings', S.settings);
}
function onField(e){
  const el=e.target;
  if(el.id==='q'){ if(S.q!==el.value){ S.q=el.value; renderChips(); renderListBody(); } return; }
  const f=el.dataset?.f; if(!f || el.tagName==='DIV') return;
  const form=formOf(el), o=objOf(form); if(!o) return;
  if(String(getPath(o,f)??'')===el.value) return;
  setPath(o, f, el.value); afterChange(form);
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-act]'); if(!t) return;
  const act=t.dataset.act, id=t.dataset.id;
  switch(act){
    case 'back': e.preventDefault(); back(); break;
    case 'add': if(S.compare){ S.compare=false; S.selected.clear(); } openEdit(null); break;
    case 'open':
      if(S.compare){ if(S.selected.has(id)) S.selected.delete(id); else if(S.selected.size>=3){ toast('最多比較 3 間'); break; } else S.selected.add(id); renderListBody(); renderBar(); }
      else openView('detail',{id});
      break;
    case 'open-detail': openView('detail',{id}); break;
    case 'dial': e.stopPropagation(); S.dial={id, t:Date.now()}; break;
    case 'star': { e.stopPropagation(); const l=getL(id); l.favorite=!l.favorite; await saveListing(l,false); toast(l.favorite?'已標為優先考慮':'已取消優先'); renderView(); break; }
    case 'tab': S.tab=t.dataset.k; savePrefs(); renderChips(); renderListBody(); scrollTo(0,0); break;
    case 'filters': openFilterSheet(); break;
    case 'clear-filters': { const sort=S.filters.sort; S.filters={...DEFAULT_FILTERS, sort}; S.q=''; savePrefs(); renderList(); if(t.dataset.keep){ const sb=$('.sheet[data-form="filters"] .sbody'); if(sb) sb.innerHTML=filterBody(); updateFilterCount(); } break; }
    case 'cmp-mode': S.compare=!S.compare; if(!S.compare) S.selected.clear(); else toast('點卡片勾選 2～3 間'); renderList(); break;
    case 'cmp-go': openView('compare'); break;
    case 'settings': openView('settings'); break;
    case 'snooze': await setMeta('bannerSnooze', Date.now()+3*86400e3); renderListBody(); break;
    case 'edit': openEdit(id); break;
    case 'save-edit': saveDraft(); break;
    case 'ph-add': photoKind=t.dataset.kind; filePhoto.click(); break;
    case 'loc-here': {
      t.disabled=true; const old=t.innerHTML; t.textContent='定位中…';
      try{ const p=await getHere(); setDraftLoc(p.lat,p.lng,p.acc,'here'); toast(`已記下位置（誤差約 ${p.acc} 公尺）`); fillAddrFromLoc(); }
      catch(err){ t.disabled=false; t.innerHTML=old; toast(err && err.code===1 ? '沒有定位權限。請到瀏覽器的網站設定允許「位置」。' : '定位失敗，請到戶外或開啟手機定位後再試', {ms:6000}); }
      break; }
    case 'loc-addr': fillAddrFromLoc(true); break;
    case 'loc-clear': { const l=S.draft?.l; if(l){ l.lat=null; l.lng=null; l.locAcc=null; l.locSrc=''; S.draft.dirty=true; renderLocBox(); } break; }
    case 'ocr': fileOcr.click(); getOcrWorker().catch(()=>{}); break;
    case 'ocr-again': back(); setTimeout(()=>fileOcr.click(), 60); break;
    case 'fillin': { const inp=$('#'+t.dataset.target); if(inp){ inp.value=t.dataset.v; inp.dispatchEvent(new Event('input',{bubbles:true})); } t.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on', c===t)); break; }
    case 'ph-rm': { const pid=t.dataset.pid, d=S.draft; d.l.photos=d.l.photos.filter(p=>p.id!==pid); if(d.pending.has(pid)) d.pending.delete(pid); else d.removed.add(pid); d.dirty=true; renderPhotoEdit(); break; }
    case 'view-draft': { const ps=S.draft.l.photos.map(p=>p.id); openViewer(ps, ps.indexOf(t.dataset.pid2)); break; }
    case 'view': { const l=getL(id); const ps=Object.keys(KINDS).flatMap(k=>l.photos.filter(p=>p.kind===k)).map(p=>p.id); openViewer(ps, +t.dataset.i); break; }
    case 'vprev': if(S.viewer && S.viewer.i>0){ S.viewer.i--; renderViewer(); } break;
    case 'vnext': if(S.viewer && S.viewer.i<S.viewer.pids.length-1){ S.viewer.i++; renderViewer(); } break;
    case 'set-status': { const l=getL(id), v=t.dataset.v; if(l.status===v) break; l.log.push({t:Date.now(), text:`狀態 → ${v}`}); l.status=v; await saveListing(l); renderView(); break; }
    case 'call-sheet': openCallSheet(id); break;
    case 'visit-sheet': openVisitSheet(id); break;
    case 'missed': await markMissed(id); if(t.dataset.close){ back(); setTimeout(renderView,30); } else renderView(); break;
    case 'sheet-save': { const s=S.sheet; if(!s?.onSave) { back(); break; } t.disabled=true; try{ await s.onSave(s.obj); }catch(err){ toast('儲存失敗，請再試一次'); t.disabled=false; break; } back(); setTimeout(renderView,30); break; }
    case 'pick': {
      const form=formOf(t), o=objOf(form); if(!o) break;
      const f=t.dataset.f, grp=t.closest('.seg'); let v=t.dataset.v;
      if(String(getPath(o,f))===v && grp.dataset.empty!=='0') v='';
      grp.querySelectorAll('.chip').forEach(c=>{ if(c.dataset.f===f) c.classList.toggle('on', c.dataset.v===v); });
      setPath(o,f,v); afterChange(form); break;
    }
    case 'rate': { const o=S.sheet?.obj; if(!o) break; let v=+t.dataset.v; if(+o.rating===v) v=0; o.rating=v; t.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('on', +b.dataset.v<=v)); break; }
    case 'nc': { const o=S.sheet?.obj; if(!o) break; let v=''; if(!t.dataset.clear){ const d=new Date(); d.setDate(d.getDate()+(+t.dataset.d)); d.setHours(+t.dataset.h,0,0,0); v=dtLocal(d); } o.nextContact=v; $('#ncInput').value=v; break; }
    case 'copy': { const v=t.dataset.v; try{ await navigator.clipboard.writeText(v); toast('已複製 '+v); }catch(err){ toast('無法自動複製，請長按號碼選取'); } break; }
    case 'delete': softDelete(id); break;
    case 'restore': restore(id); break;
    case 'purge': { const tr=S.listings.filter(l=>l.deletedAt); if(await confirmDlg({title:`永久刪除 ${tr.length} 筆？`, body:'連同照片一起刪除，之後無法復原。', ok:'永久刪除', danger:true})){ for(const l of tr) await hardDelete(l); toast('已永久刪除'); renderView(); } break; }
    case 'export': exportJSON(t.dataset.photos==='1', !!t.dataset.share); break;
    case 'csv': exportCSV(); break;
    case 'import': fileImport.click(); break;
    case 'persist': await requestPersist(); renderSettings(); break;
    case 'sample': loadSample(); break;
    case 'dlg': { const d=S.dialog; closeDialog(); d?.resolve(t.dataset.v==='1'); break; }
    case 'toast-act': { const tt=$('#toast'); const fn=tt._fn; tt.hidden=true; tt._fn=null; fn && fn(); break; }
  }
});

/* 撥完電話回到畫面時，提醒記錄結果 */
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState!=='visible' || !S.dial) return;
  const {id,t}=S.dial, dt=Date.now()-t; S.dial=null;
  if(dt<4000 || dt>30*60e3) return;
  const l=getL(id); if(!l) return;
  toast(`剛剛打給「${nameOf(l)}」，記一下結果？`, {action:{label:'記錄通話', fn:()=>openCallSheet(id)}, ms:10000});
});

/* ========== 啟動 ========== */
(async function init(){
  await DB.open();
  try{ for(const m of await DB.all('meta')) S.meta[m.k]=m.v; }catch(e){}
  S.settings={quality:'std', ...(S.meta.settings||{})};
  loadPrefs();
  try{ S.listings=(await DB.all('listings')).map(normalize); }catch(e){ S.listings=[]; }
  try{ await purgeOld(); }catch(e){}
  renderView();
  if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
</script>
